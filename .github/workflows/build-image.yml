name: Create and publish a Docker image

on:
  workflow_run:
    workflows: ["Test package"]
    branches:
    - main
    types:
      - completed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success'
        && github.repository == 'AV-EFI/efi-conv'
      }}
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the
    # actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # This step uses
      # [docker/metadata-action](https://github.com/docker/metadata-action#about)
      # to extract tags and labels that will be applied to the
      # specified image. The `id` "meta" allows the output of this
      # step to be referenced in a subsequent step. The `images` value
      # provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      # Uses the `docker/login-action` action to log in to the
      # Container registry using the account and password that will
      # publish the packages. Once published, the packages are scoped
      # to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Hack working around the lack of case conversion in workflow syntax
      - name: Get repository name in lowercase
        id: lower-repo
        run: |
          echo "repo=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT
        shell: bash

      # This step uses the `docker/build-push-action` action to build
      # the image, based on your repository's `Dockerfile`. If the
      # build succeeds, it pushes the image to GitHub Packages. It
      # uses the `context` parameter to define the build's context as
      # the set of files located in the specified path. For more
      # information, see
      # [Usage](https://github.com/docker/build-push-action#usage) in
      # the README of the `docker/build-push-action` repository. It
      # uses the `tags` and `labels` parameters to tag and label the
      # image with the output from the "meta" step.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ steps.lower-repo.outputs.repo }}:latest
          labels: ${{ steps.meta.outputs.labels }}

      # This step generates an artifact attestation for the image,
      # which is an unforgeable statement about where and how it was
      # built. It increases supply chain security for people who
      # consume the image. For more information, see [Using artifact
      # attestations to establish provenance for
      # builds](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds).
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: >-
            ${{ env.REGISTRY }}/${{ steps.lower-repo.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
